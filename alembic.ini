# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic reads this file when you run `alembic` from the backend/ directory.
#
# DATABASE URL: we intentionally leave sqlalchemy.url blank here.
# alembic/env.py reads the value from our Pydantic Settings at runtime so
# there is a single source of truth (.env / environment variables) and we never
# accidentally hard-code credentials in this file.

[alembic]
script_location = alembic
prepend_sys_path = .

# Filename pattern for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Leave blank – overridden in env.py from Pydantic Settings
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format migration files with ruff after generation:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
